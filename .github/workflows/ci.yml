name: CI

on:
  pull_request:
  # The merge queue requires "Build, vet, test" on each merge group commit,
  # i.e. the pull request applied on top of main and every entry ahead of it.
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  # The full suite (unit tests, cross-compiles, the Docker profiles) runs only
  # when someone starts it:  gh workflow run ci.yml --ref <branch>
  # Every other event runs the public check, and on a pull request or push
  # also the board page and srq selftests (ops/PATCHES.md §74).
  workflow_dispatch:

permissions:
  contents: read

# Each merge queue entry has its own gh-readonly-queue/... ref, so entries
# never cancel one another.
concurrency:
  group: ci-${{ github.ref }}
  # Superseded pull request pushes are moot, but every commit on main needs a
  # finished run. Cancelling main pushes meant rapid merges left main with no
  # completed result at all, so "is main red?" had no answer.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Where the Linux jobs run is the repository variable LINUX_RUNNER, a JSON value for runs-on. With no
# such variable they run on GitHub's ubuntu-latest, which is what a public repository must do: a
# self-hosted runner on a public repository lets any pull request run code on it.
jobs:
  # Fork (discordwell/subrouter): upstream's CLA step, deploy-scripts job
  # (deploy/macos deploy, guard, verify, canary, upgrade-host and autoupdate
  # suites, the bake gate end to end, shellcheck), shadow rehearsal,
  # exact-head client artifact and macOS LaunchAgent job are left out. They
  # test what this fork does not run: the CLA, upstream's deploy/macos
  # pipeline and autoupdater, the supervisor, and upstream's coordinator.
  # The owner keeps the macOS suite local (ops/PATCHES.md §23, §45.1).
  #
  # "Build, vet, test" is the long-standing required check. It is now a
  # small gate over jobs that run in parallel, so wall time is the slowest
  # of them rather than their sum.
  test:
    name: Build, vet, test
    runs-on: ${{ fromJSON(vars.LINUX_RUNNER || '"ubuntu-latest"') }}
    needs: [changes, unit, cross-compile, public-check]
    # Run when a gated job fails (so the required check fails too), but not
    # when the whole run is cancelled because a newer push superseded it:
    # that run's result is moot and would only post a red check on the old
    # commit.
    if: ${{ !cancelled() }}
    steps:
      - name: Require every gated job to pass
        # A gated job may be skipped only because the classifier succeeded
        # and found nothing it tests. A failed or cancelled classifier skips
        # them too, so its own result must be success.
        env:
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          PUBLIC: ${{ needs.public-check.result }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "classifier: ${CHANGES}, code changed: ${CODE}; gated job results: ${RESULTS}"
          [ "${CHANGES}" = "success" ] || exit 1
          # The public check runs on every change, so it is never skipped.
          [ "${PUBLIC}" = "success" ] || exit 1
          for result in ${RESULTS}; do
            if [ "${result}" = "skipped" ] && [ "${CODE}" = "false" ]; then
              continue
            fi
            [ "${result}" = "success" ] || exit 1
          done

  unit:
    name: Unit tests
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ${{ fromJSON(vars.LINUX_RUNNER || '"ubuntu-latest"') }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # The node version the Docker test image carries. The board page tests
      # run in it, and SUBROUTER_TEST_REQUIRE_NODE=1 below fails them without it.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 26.13.1
          package-manager-cache: false

      - name: Check formatting
        # Nothing checked gofmt, so unformatted files reached main.
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "${unformatted}" ]; then
            echo "::error title=gofmt::run gofmt -w on these files:"
            echo "${unformatted}"
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        env:
          SUBROUTER_TEST_REQUIRE_NODE: "1"
        run: CGO_ENABLED=0 go test ./...

      - name: Test the ops tools
        # ops/ is its own module, so the step above never runs it. Neither
        # suite depends on the other, so a red one does not skip this.
        if: ${{ !cancelled() }}
        run: cd ops && go test -count=1 ./...

      - name: Test srq
        if: ${{ !cancelled() }}
        run: python3 ops/bin/srq selftest

  # Every pull request and push runs the board page's node tests and srq's
  # selftest, which need no Go build. Nothing waits on this job: it is not
  # in the "Build, vet, test" gate (ops/PATCHES.md §74).
  page-and-srq:
    name: Board page and srq selftests
    if: ${{ github.event_name != 'merge_group' }}
    runs-on: ${{ fromJSON(vars.LINUX_RUNNER || '"ubuntu-latest"') }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 26.13.1
          package-manager-cache: false

      - name: Test the board page
        run: node --test internal/proxy/pool_ui_page_test.mjs

      - name: Test srq
        if: ${{ !cancelled() }}
        run: python3 ops/bin/srq selftest

  # The classifier skips the unit job when a change touches only Markdown,
  # planning/ or cloudflare/, and the docs are where most private pointers
  # sit. So this job has no classifier condition and runs on every pull
  # request, merge group and push.
  public-check:
    name: Public check
    runs-on: ${{ fromJSON(vars.LINUX_RUNNER || '"ubuntu-latest"') }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: ops/go.mod
          cache: false

      - name: Check tracked files for tailnet addresses and private pointers
        run: cd ops && go test -count=1 ./publiccheck

  # CI tests only linux/amd64, but releases cross-compile for every platform
  # below. A platform-specific symbol (syscall.SIGUSR1 does not exist on
  # Windows) therefore passed CI, merged, and only broke at release tag time.
  # Catch it on the PR instead.
  #
  # One runner building all 16 targets was the slowest job most PRs waited
  # on, and a third of it was moving a 2.6 GB build cache that was re-saved
  # under a new key on every run. Each OS group now runs as its own job with
  # at most one target per runner core, and keeps a small build cache of its
  # own (setup-go's cache never saves cross-compiled objects once its key
  # already exists). Only main saves those caches; pull requests restore
  # main's copy and never write one.
  cross-compile:
    name: Cross-compile release targets (${{ matrix.group }})
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ${{ fromJSON(vars.LINUX_RUNNER || '"ubuntu-latest"') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: darwin
            targets: darwin/amd64 darwin/arm64
          - group: linux
            targets: linux/386 linux/amd64 linux/arm linux/arm64
          - group: windows
            targets: windows/386 windows/amd64 windows/arm64
          - group: freebsd
            targets: freebsd/386 freebsd/amd64 freebsd/arm64
          - group: netbsd-openbsd
            targets: netbsd/amd64 netbsd/arm64 openbsd/amd64 openbsd/arm64
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore cross-compile build cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          # go.mod is in the key so a toolchain bump starts a fresh cache
          # rather than restoring stdlib objects the new compiler ignores.
          key: cross-${{ matrix.group }}-${{ hashFiles('go.mod', 'go.sum') }}

      - name: Cross-compile
        env:
          TARGETS: ${{ matrix.targets }}
        run: |
          set -euo pipefail
          go mod download
          printf '%s\n' ${TARGETS} |
            xargs -P "$(nproc)" -I{} sh -c '
              target="{}"
              if CGO_ENABLED=0 GOOS="${target%/*}" GOARCH="${target#*/}" go build -o /dev/null ./... 2>"/tmp/build-${target%/*}-${target#*/}.log"; then
                echo "ok      ${target}"
              else
                echo "FAILED  ${target}"; cat "/tmp/build-${target%/*}-${target#*/}.log"; exit 255
              fi'

      - name: Save cross-compile build cache
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ steps.cache.outputs.cache-primary-key }}

  docker-smoke:
    name: Docker local and team profiles
    # Not gated by "Build, vet, test", so nothing in the queue waits on it.
    # It already ran on the pull request and runs again on the push to main.
    needs: changes
    if: ${{ github.event_name != 'merge_group' && needs.changes.outputs.code == 'true' }}
    runs-on: ${{ fromJSON(vars.LINUX_RUNNER || '"ubuntu-latest"') }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Exercise both profiles under the production memory limit
        run: deploy/docker/smoke-test.sh

  # Decides which jobs a change needs. Every push to main runs everything,
  # and any error listing files runs everything too.
  #
  # code: a change that touches only files no job below reads (Markdown,
  # LICENSE, planning/, and cloudflare/, which cloudflare-do.yml tests) skips
  # the Go, script, and Docker jobs. "Build, vet, test" still reports, so the
  # required check passes instead of waiting for a run that never starts.
  changes:
    name: Detect changed paths
    runs-on: ${{ fromJSON(vars.LINUX_RUNNER || '"ubuntu-latest"') }}
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Classify changed files
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          MERGE_GROUP_BASE: ${{ github.event.merge_group.base_sha }}
          MERGE_GROUP_HEAD: ${{ github.event.merge_group.head_sha }}
        run: |
          run_everything() {
            echo "code=true" >> "${GITHUB_OUTPUT}"
            exit 0
          }
          # Until this project has users, a change is tested where it is built
          # and merged without waiting here; a bad merge costs a fix. So only a
          # run someone starts tests the code. "Build, vet, test" still
          # reports on every event, with the public check (ops/PATCHES.md §74).
          if [ "${EVENT}" != "workflow_dispatch" ]; then
            echo "code=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          case "${EVENT}" in
            pull_request)
              if ! files="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR}/files" --jq '.[].filename')"; then
                echo "::warning::could not list changed files; running every job"
                run_everything
              fi
              ;;
            merge_group)
              # The merge group commit against main: this entry plus the ones
              # ahead of it. The compare API lists at most 300 files, so a
              # larger group runs everything rather than trusting a partial list.
              if ! files="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${MERGE_GROUP_BASE}...${MERGE_GROUP_HEAD}" --jq '.files[].filename')"; then
                echo "::warning::could not list changed files; running every job"
                run_everything
              fi
              if [ "$(printf '%s\n' "${files}" | grep -c .)" -ge 300 ]; then
                run_everything
              fi
              ;;
            *)
              run_everything
              ;;
          esac
          if [ -z "${files}" ]; then
            run_everything
          fi
          skip_only='(\.md$|^LICENSE$|^planning/|^cloudflare/)'
          if printf '%s\n' "${files}" | grep -vqE "${skip_only}"; then
            echo "code=true" >> "${GITHUB_OUTPUT}"
          else
            echo "code=false" >> "${GITHUB_OUTPUT}"
          fi

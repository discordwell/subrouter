name: Release

# A pushed tag builds and tests, then publishes the immutable binaries that
# install.sh, `sr server install` and the GCP deploys fetch.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify artifacts
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      source_commit: ${{ steps.version.outputs.source_commit }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Determine release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || {
            echo "release tag must be versioned, for example v0.1.52" >&2
            exit 1
          }
          version="${GITHUB_REF_NAME#v}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          source_commit="$(git rev-parse "${GITHUB_REF}^{commit}")"
          echo "source_commit=${source_commit}" >> "${GITHUB_OUTPUT}"

      - name: Require release commit on protected main
        env:
          SOURCE_COMMIT: ${{ steps.version.outputs.source_commit }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git merge-base --is-ancestor "${SOURCE_COMMIT}" origin/main || {
            echo "refusing to release a tag whose commit is not on origin/main" >&2
            exit 1
          }

      - name: Test Go packages
        run: CGO_ENABLED=0 go test ./...

      - name: Build Go release binaries
        run: scripts/build-release.sh "${{ steps.version.outputs.version }}"

      - name: Copy deployment helpers into release assets
        env:
          SOURCE_COMMIT: ${{ steps.version.outputs.source_commit }}
        run: |
          set -euo pipefail
          cp install.sh dist/release/install.sh
          cp deploy/gcp/install-front-slots.sh dist/release/install-front-slots.sh
          cp deploy/gcp/deployment-contract.py dist/release/deployment-contract.py
          jq -n --arg tag "${GITHUB_REF_NAME}" --arg source_revision "${SOURCE_COMMIT}" \
            '{tag:$tag,source_revision:$source_revision,tag_on_main:true}' \
            >dist/release/SOURCE_PROVENANCE.json
          (
            cd dist/release
            find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n' \
              | LC_ALL=C sort \
              | xargs sha256sum >SHA256SUMS
            sha256sum --check SHA256SUMS
          )

      - name: Attest complete release asset set
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/release/*

      - name: Upload Go release artifacts
        uses: actions/upload-artifact@v5
        with:
          name: release-assets
          path: dist/release/*
          if-no-files-found: error

  github-release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      attestations: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Download Go release artifacts
        uses: actions/download-artifact@v5
        with:
          name: release-assets
          path: dist/release

      - name: Stage, verify, and publish immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: v${{ needs.build.outputs.version }}
          SOURCE_COMMIT: ${{ needs.build.outputs.source_commit }}
        run: bash scripts/publish-github-release.sh dist/release
